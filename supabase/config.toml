[functions.execute]
verify_jwt = false

[functions.healthcheck]
verify_jwt = false

[functions.report]
verify_jwt = false

[functions.proof]
verify_jwt = false

[functions.connect]
verify_jwt = false

[functions.github-callback]
verify_jwt = false
