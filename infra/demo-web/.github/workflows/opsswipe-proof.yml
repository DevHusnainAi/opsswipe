# OpsSwipe proof: before a fix can be merged, replay the requests that failed in production
# against this PR's code, run the tests, and report the result for this exact commit.
name: opsswipe-proof
on: pull_request

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Tests
        id: tests
        run: |
          if node --test; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Start this PR's build
        run: |
          PORT=3000 node server.js &
          for i in $(seq 30); do curl -sf http://127.0.0.1:3000/livez && break; sleep 1; done

      - name: Replay failing production requests
        id: replay
        run: node scripts/replay.js http://127.0.0.1:3000 || echo "replay failed"

      - name: Report to OpsSwipe
        env:
          OPSSWIPE_PROOF_URL: ${{ secrets.OPSSWIPE_PROOF_URL }}
          PROOF_SECRET: ${{ secrets.PROOF_SECRET }}
          TESTS_PASSED: ${{ steps.tests.outputs.passed }}
        run: node scripts/proof.js

      - name: Fail the check if the proof failed
        run: |
          test "${{ steps.tests.outputs.passed }}" = "true"
          node -e "const r=require('./replay-result.json'); process.exit(r.passed===r.total?0:1)"
