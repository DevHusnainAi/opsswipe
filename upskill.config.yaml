# huggingface/upskill: generate skills with a teacher model, prove them on a cheaper student model.
# https://github.com/huggingface/upskill
skill_generation_model: copilot.claude-opus-5.5   # teacher, via GitHub Copilot OAuth (no API key)
eval_model: copilot.claude-haiku-4.5          # student: a skill should lift the cheap model
skills_dir: ./.claude/skills    # Claude Code loads project skills from here
runs_dir: ./.upskill/runs       # eval logs (gitignored)
max_refine_attempts: 2
executor: local                 # run evals on this machine, not HF Jobs
num_runs: 1
max_parallel: 3
