name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno fmt --check
      - run: deno task lint
      - run: deno task check
      - run: deno task test
      - run: deno task eval # rule-based suggestions: 100% allowlist + labels, or the build fails

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: ci }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: ci }
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/setup/supabase-stubs.sql
      - run: for m in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$m"; done
      - run: for t in supabase/tests/*.sql; do psql -v ON_ERROR_STOP=1 -f "$t"; done

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  demo-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node --test infra/demo-web/
